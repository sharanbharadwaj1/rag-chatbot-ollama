services:
  rag-chatbot-gemini:
    build:
      context: ./backend
    container_name: rag-chatbot-gemini-local
    ports:
      - "8080:8080"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-AIzaSyCnt_xX7GtpyKCzBKurevhOIUneojruu0c}
      VECTOR_DB_PATH: /mnt/chroma/local_chroma_db
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-langchain}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    volumes:
      - ./local_chroma_db:/mnt/chroma/local_chroma_db
    restart: unless-stopped
